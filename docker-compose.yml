version: "3.9"

services:
  migrate:
    image: migrate/migrate
    container_name: location-migrate

    volumes:
      - ./migrations:/migrations

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://location_user:your_password@postgres:5432/location_db?sslmode=disable",
        "up",
      ]

    depends_on:
      - postgres

    restart: "no"

  postgres:
    image: postgres:17
    container_name: location-postgres

    environment:
      POSTGRES_DB: location_db
      POSTGRES_USER: location_user
      POSTGRES_PASSWORD: your_password

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data:
